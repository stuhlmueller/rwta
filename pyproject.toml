[project]
name = "rwta"
version = "0.1.0"
description = "A real-world text adventure powered by Claude Opus 4.7"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "duckduckgo-search>=8.0.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "pyright>=1.1", "ruff>=0.8", "pre-commit"]

[project.scripts]
rwta = "rwta.main:main"
rwta-gui-server = "rwta.gui_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwta"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]  # Allow long lines (prompts), try/except/pass is fine

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/rwta"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
