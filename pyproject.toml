[project]
name = "text-adventure"
version = "0.1.0"
description = "A real-world text adventure powered by Claude Opus 4.5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[project.scripts]
text-adventure = "rwta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwta"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "standard"
