[project]
name = "text-adventure"
version = "0.1.0"
description = "A real-world text adventure powered by Claude Opus 4.5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[project.scripts]
text-adventure = "rwta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwta"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (can reduce readability)
]

[tool.ruff.lint.isort]
known-first-party = ["rwta"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
